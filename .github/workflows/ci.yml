name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/contracts/requirements.txt
      - name: Install pinned contract validation dependencies
        run: python -m pip install -r tests/contracts/requirements.txt
      - name: Validate event schemas and API contracts
        run: |
          set -o pipefail
          mkdir -p artifacts
          python scripts/validate_contracts.py 2>&1 | tee artifacts/contracts.log
      - name: Upload contract validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-reports
          path: artifacts/
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/dashboard/package-lock.json
      - name: Install locked dashboard test dependencies
        run: npm ci --prefix tests/dashboard
      - name: Install Chromium and system dependencies
        working-directory: tests/dashboard
        run: npx playwright install --with-deps chromium
      - name: Exercise dashboard interactions and API states
        working-directory: tests/dashboard
        env:
          SCREENSHOT_PATH: ../../artifacts/dashboard-test.png
        run: |
          set -o pipefail
          mkdir -p ../../artifacts
          npm test 2>&1 | tee ../../artifacts/dashboard-tests.log
      - name: Upload dashboard test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-test-reports
          path: artifacts/
  java-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit, local Spark, and real Mongo integration tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: ./mvnw -B -ntp --fail-at-end -Pintegration,spark-tests,coverage verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: |
            services/*/target/site/jacoco/
            services/*/target/jacoco.exec
  pipeline-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - name: Validate infrastructure
        run: python scripts/validate_configs.py
      - name: Build and start Kafka, MongoDB, API, Spark
        run: docker compose up -d --build
      - name: Exercise rules, idempotency, conflict, and checkpoint recovery
        run: python scripts/e2e.py --with-recovery --timeout 300
      - name: Measure synthetic HTTP ingestion
        run: python scripts/load_generator.py --count 120 --rate 20 --report artifacts/load-report.json
      - name: Enforce k6 ingestion reliability and latency thresholds
        run: |
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work -e GITHUB_SHA \
            grafana/k6:2.2.0@sha256:9bd01d6941fca969cb61bb57d2da5ee9b385fe2aa8881df3798c196564d6ace6 run tests/performance/ingestion.k6.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/dashboard/package-lock.json
      - name: Install live dashboard capture dependencies
        run: npm ci --prefix tests/dashboard
      - name: Install Chromium for live dashboard evidence
        working-directory: tests/dashboard
        run: npx playwright install --with-deps chromium
      - name: Capture dashboard connected to the real running pipeline
        env:
          PUBLISH_DEMO_SNAPSHOT: 'true'
        run: node tests/dashboard/capture-live.cjs
      - name: Capture runtime evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - name: Upload pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: artifacts/
      - name: Tear down ephemeral CI stack
        if: always()
        run: docker compose down -v
  kubernetes:
    uses: ./.github/workflows/kubernetes.yml
  quality-gate:
    name: Quality gate
    if: always()
    needs: [contracts, dashboard, java-tests, pipeline-e2e, kubernetes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download all test evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: artifacts/test-results
      - name: Build consolidated test report
        if: always()
        run: python scripts/test_report.py --artifacts artifacts/test-results --output artifacts/test-report.md
      - name: Add test report to the workflow summary
        if: always()
        run: |
          if [ -f artifacts/test-report.md ]; then
            cat artifacts/test-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload consolidated test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-test-report
          path: artifacts/test-report.md
      - name: Require every validation job to succeed
        if: always()
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["REQUIRED_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n| Required job | Result |\n| --- | --- |\n")
              for name, job in results.items():
                  summary.write(f"| {name} | {job['result']} |\n")
          if failed:
              print("Quality gate failed: " + json.dumps(failed), file=sys.stderr)
              sys.exit(1)
          print("Quality gate passed: all five required validation jobs succeeded")
          PY
