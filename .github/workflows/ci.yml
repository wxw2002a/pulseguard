name: verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/dashboard/package-lock.json
      - name: Install locked dashboard test dependencies
        run: npm ci --prefix tests/dashboard
      - name: Install Chromium and system dependencies
        working-directory: tests/dashboard
        run: npx playwright install --with-deps chromium
      - name: Exercise dashboard interactions and API states
        working-directory: tests/dashboard
        run: npm test
  java-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Unit, local Spark, and real Mongo integration tests
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: ./mvnw -B -ntp --fail-at-end -Pintegration,spark-tests verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-test-reports
          path: |
            services/*/target/surefire-reports/
            services/*/target/failsafe-reports/
  pipeline-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.34.1
      - name: Validate infrastructure
        run: python scripts/validate_configs.py
      - name: Build and start Kafka, MongoDB, API, Spark
        run: docker compose up -d --build
      - name: Exercise rules, idempotency, conflict, and checkpoint recovery
        run: python scripts/e2e.py --with-recovery --timeout 300
      - name: Measure synthetic HTTP ingestion
        run: python scripts/load_generator.py --count 120 --rate 20 --report artifacts/load-report.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/dashboard/package-lock.json
      - name: Install live dashboard capture dependencies
        run: npm ci --prefix tests/dashboard
      - name: Install Chromium for live dashboard evidence
        working-directory: tests/dashboard
        run: npx playwright install --with-deps chromium
      - name: Capture dashboard connected to the real running pipeline
        env:
          PUBLISH_DEMO_SNAPSHOT: 'true'
        run: node tests/dashboard/capture-live.cjs
      - name: Capture runtime evidence
        if: always()
        run: |
          mkdir -p artifacts
          docker compose ps -a > artifacts/compose-status.txt
          docker compose logs --no-color > artifacts/compose.log 2>&1
      - name: Upload pipeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-evidence
          path: artifacts/
      - name: Tear down ephemeral CI stack
        if: always()
        run: docker compose down -v
