name: publish-pages
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish-verified-demo:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact verified source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download evidence from the successful source workflow
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name pipeline-evidence --dir artifacts/pages-source
      - name: Build the static site from the verified synthetic snapshot
        run: python scripts/build_pages.py --snapshot artifacts/pages-source/dashboard-snapshot.json --output _site
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/dashboard/package-lock.json
      - name: Install published-site browser checks
        run: npm ci --prefix tests/dashboard
      - name: Install Chromium
        working-directory: tests/dashboard
        run: npx playwright install --with-deps chromium
      - name: Verify the actual public deployment
        env:
          BASE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: node tests/dashboard/deployed-smoke.cjs
      - name: Retain published-site report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-site-evidence
          path: artifacts/deployed-browser/
