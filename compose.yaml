name: pulseguard
services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    restart: unless-stopped
  topic-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic transactions.v1 --partitions 6 --replication-factor 1 --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --describe --topic transactions.v1
    restart: "no"
  mongodb:
    image: mongo:7.0.30
    command: [mongod, --bind_ip_all]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  api:
    image: pulseguard-api:local
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MONGODB_URI: mongodb://mongodb:27017/pulseguard
      INGEST_API_KEY: ${INGEST_API_KEY:-local-dev-key}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      topic-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    mem_limit: 768m
    restart: unless-stopped
  streaming:
    image: pulseguard-streaming:local
    build:
      context: .
      dockerfile: Dockerfile.streaming
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      MONGODB_URI: mongodb://mongodb:27017/pulseguard
      CHECKPOINT_DIR: /var/lib/pulseguard/checkpoints
    ports:
      - "127.0.0.1:4040:4040"
    volumes:
      - spark-checkpoints:/var/lib/pulseguard/checkpoints
    depends_on:
      topic-init:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    mem_limit: 2g
    stop_grace_period: 60s
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-grafana-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  kafka-data:
  mongo-data:
  spark-checkpoints:
  prometheus-data:
  grafana-data:
