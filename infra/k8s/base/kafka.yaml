apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  clusterIP: None
  # KRaft must resolve its voter hostname before the broker becomes Ready.
  publishNotReadyAddresses: true
  selector: {app: kafka}
  ports:
    - {name: client, port: 9092}
    - {name: controller, port: 9093}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: {app: kafka}
  template:
    metadata:
      labels: {app: kafka}
    spec:
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports:
            - {containerPort: 9092, name: client}
            - {containerPort: 9093, name: controller}
          env:
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka-0.kafka.pulseguard.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka-0.kafka.pulseguard.svc.cluster.local:9093"}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
          startupProbe:
            tcpSocket: {port: client}
            failureThreshold: 36
            periodSeconds: 5
          readinessProbe:
            exec:
              command: [/opt/kafka/bin/kafka-topics.sh, --bootstrap-server, localhost:9092, --list]
            periodSeconds: 15
            timeoutSeconds: 10
          livenessProbe:
            tcpSocket: {port: client}
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 5Gi}
