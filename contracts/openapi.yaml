openapi: 3.1.0
info:
  title: PulseGuard API
  version: 2.0.0
  description: Local transaction ingestion and collaborative risk investigation. Review commands require a version and operation ID. Alert queues support cursor pagination; other lists return bounded recent records.
servers:
- url: http://localhost:8080
paths:
  /api/v1/transactions:
    post:
      operationId: acceptTransaction
      summary: Atomically accept an immutable transaction and its outbox entry
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./transaction.v1.schema.json
      responses:
        '202':
          description: Accepted, including an identical retry
          content:
            application/json:
              schema:
                type: object
                required:
                - transactionId
                - status
                - duplicate
                properties:
                  transactionId:
                    type: string
                  status:
                    type: string
                    const: ACCEPTED
                  duplicate:
                    type: boolean
        '400':
          description: Invalid transaction
        '401':
          description: Missing or incorrect X-API-Key
        '409':
          description: Transaction ID already belongs to a different payload
        '503':
          $ref: '#/components/responses/StorageUnavailable'
    get:
      operationId: listTransactions
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Recent transactions, newest ingestion first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/TransactionView'
        '400':
          description: Invalid query parameters
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/alerts:
    get:
      operationId: listAlerts
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/AccountId'
      - name: severity
        in: query
        schema:
          type: string
          enum:
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
      - name: status
        in: query
        schema:
          type: string
          enum: [OPEN, INVESTIGATING, RESOLVED]
      - name: owner
        in: query
        description: Exact self-reported operator label.
        schema:
          type: string
          minLength: 2
          maxLength: 64
      - name: cursor
        in: query
        description: Opaque nextCursor from the preceding page. Keep filters unchanged; concurrent queue changes are not a snapshot.
        schema:
          type: string
          minLength: 1
          maxLength: 512
      responses:
        '200':
          description: Risk signals ordered by createdAt and ID descending, filtered before pagination.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Alert'
                  nextCursor:
                    type: [string, 'null']
        '400':
          description: Invalid query parameters
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/alerts/{id}:
    get:
      operationId: getAlert
      parameters:
      - $ref: '#/components/parameters/AlertId'
      - name: historyLimit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      responses:
        '200':
          description: Alert detail with bounded recent review history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '404':
          description: Unknown alert ID
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '400':
          description: Invalid query or path parameter
  /api/v1/alerts/{id}/evidence:
    get:
      operationId: getAlertEvidence
      parameters:
      - $ref: '#/components/parameters/AlertId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
      responses:
        '200':
          description: Pinned detection IDs for new alerts; clearly marked contextual records for legacy window alerts. Counts expose missing ledger records and bounded evidence.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TransactionView'
                  provenance:
                    type: string
                    enum: [PINNED_DETECTION, LEGACY_TRANSACTION_CONTEXT, LEGACY_WINDOW_CONTEXT]
                  evidenceCount:
                    type: integer
                    description: Total matching events at detection, or total contextual records for a legacy alert.
                  matchedCount:
                    type: integer
                    description: Available ledger matches before the response limit.
                  missingCount:
                    type: integer
                    description: Pinned IDs absent from the ledger, excluding IDs omitted by the capture cap.
                  truncated:
                    type: boolean
                  complete:
                    type: boolean
        '404':
          description: Unknown alert ID
        '503':
          $ref: '#/components/responses/StorageUnavailable'
        '400':
          description: Invalid query or path parameter
  /api/v1/alerts/{id}/review:
    patch:
      operationId: reviewAlert
      security:
      - ApiKey: []
      parameters:
      - name: id
        in: path
        required: true
        description: Percent-encoded deterministic alert ID
        schema:
          type: string
          minLength: 1
          maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - action
              - expectedVersion
              - operationId
              - note
              - analyst
              allOf:
              - if:
                  properties:
                    action: {const: RESOLVE}
                then:
                  required: [disposition]
                  properties:
                    disposition: {type: string}
                else:
                  properties:
                    disposition: {type: 'null'}
              properties:
                action:
                  type: string
                  enum: [CLAIM, COMMENT, RELEASE, RESOLVE, REOPEN]
                expectedVersion:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 9223372036854775806
                operationId:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{8,80}$'
                  description: Reuse the same ID and normalized command after a timeout. A different command with the same ID conflicts.
                disposition:
                  type: [string, 'null']
                  enum: [CONFIRMED_RISK, FALSE_POSITIVE, BENIGN, null]
                  description: Required for RESOLVE; must be absent or null for other actions.
                note:
                  type: string
                  minLength: 3
                  maxLength: 1000
                  description: Minimum length is measured after trimming whitespace.
                analyst:
                  type: string
                  minLength: 2
                  maxLength: 64
                  description: Self-reported operator label, not an authenticated identity. Minimum length is measured after
                    trimming whitespace.
      responses:
        '200':
          description: Current alert with the latest 50 chronological review entries. Identical command retries do not append another entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertDetail'
        '400':
          description: Invalid review state, note, analyst label or alert ID
        '401':
          description: Missing or incorrect X-API-Key
        '404':
          description: Unknown alert ID
        '409':
          description: Stale version, invalid transition or owner, reused operation ID with changed payload, or full 500-entry history. Refresh before making a new decision.
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/outcomes:
    get:
      operationId: reviewOutcomes
      summary: Current queue and per-rule analyst disposition counts
      responses:
        '200':
          description: Current resolved labels, including UNCLASSIFIED legacy resolutions. These are analyst feedback counts, not fraud detection accuracy or prevented losses.
          content:
            application/json:
              schema:
                type: object
                properties:
                  resolvedAlerts:
                    type: integer
                  byRule:
                    type: array
                    items:
                      type: object
                      properties:
                        rule: {type: string}
                        resolved: {type: integer}
                        confirmedRisk: {type: integer}
                        falsePositive: {type: integer}
                        benign: {type: integer}
                        unclassified: {type: integer}
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/windows:
    get:
      operationId: listWindows
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Recent account/currency event-time windows
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Window'
        '400':
          description: Invalid query parameters
        '503':
          $ref: '#/components/responses/StorageUnavailable'
  /api/v1/overview:
    get:
      operationId: overview
      responses:
        '200':
          description: Dashboard totals; multiple reads are eventually consistent
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: integer
                    format: int64
                  alerts:
                    type: integer
                    format: int64
                  highRisk:
                    type: integer
                    format: int64
                    description: Unresolved HIGH or CRITICAL alerts
                  volumeByCurrency:
                    type: object
                    additionalProperties:
                      type: integer
                      format: int64
                  pendingDelivery:
                    type: integer
                    format: int64
                  reviewedAlerts:
                    type: integer
                    format: int64
        '503':
          $ref: '#/components/responses/StorageUnavailable'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    AlertId:
      name: id
      in: path
      required: true
      description: Percent-encoded deterministic alert ID
      schema:
        type: string
        minLength: 1
        maxLength: 256
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AccountId:
      name: accountId
      in: query
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,64}$
  schemas:
    ReviewEntry:
      type: object
      properties:
        action:
          type: [string, 'null']
          enum: [CLAIM, COMMENT, RELEASE, RESOLVE, REOPEN, null]
        operationId: {type: [string, 'null']}
        version: {type: [integer, 'null'], format: int64}
        disposition: {type: [string, 'null']}
        status:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - RESOLVED
        note:
          type: string
        analyst:
          type: string
        reviewedAt:
          type: string
          format: date-time
    AlertDetail:
      allOf:
      - $ref: '#/components/schemas/Alert'
      - type: object
        properties:
          reviewHistoryCount:
            type: integer
          reviewHistory:
            type: array
            items:
              $ref: '#/components/schemas/ReviewEntry'
    TransactionView:
      type: object
      properties:
        schemaVersion:
          type: integer
        transactionId:
          type: string
        accountId:
          type: string
        merchantId:
          type: string
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        country:
          type: string
        channel:
          type: string
        eventTime:
          type: string
          format: date-time
        ingestedAt:
          type: string
          format: date-time
        deliveryStatus:
          type: string
          enum:
          - PENDING
          - IN_FLIGHT
          - SENT
    Alert:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
          minimum: 0
        owner: {type: [string, 'null']}
        disposition: {type: [string, 'null']}
        resolvedAt: {type: [string, 'null'], format: date-time}
        evidenceVersion: {type: integer}
        evidenceCount: {type: integer}
        evidenceTruncated: {type: boolean}
        transactionId:
          type: string
        accountId:
          type: string
        currency:
          type: string
        rule:
          type: string
          enum:
          - HIGH_VALUE
          - VELOCITY
          - CARD_TESTING
        severity:
          type: string
        score:
          type: integer
        reasons:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
          - OPEN
          - INVESTIGATING
          - RESOLVED
        amountMinor:
          type: integer
          format: int64
        transactionCount:
          type: integer
          format: int64
        totalAmountMinor:
          type: integer
          format: int64
        eventTime:
          type: string
          format: date-time
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
    Window:
      type: object
      properties:
        id:
          type: string
        accountId:
          type: string
        currency:
          type: string
        windowStart:
          type: string
          format: date-time
        windowEnd:
          type: string
          format: date-time
        transactionCount:
          type: integer
          format: int64
        totalAmountMinor:
          type: integer
          format: int64
        highValueCount:
          type: integer
          format: int64
        updatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  responses:
    StorageUnavailable:
      description: Storage is temporarily unavailable
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
